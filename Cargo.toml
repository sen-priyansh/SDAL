[workspace]
resolver = "2"
members = [
    "crates/*",
]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4.4", features = ["derive"] }
fastcdc = "3.1"
radix_trie = "0.2"
bincode = "1.3"

